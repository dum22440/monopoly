# Configuration pour l'hébergeur Render (mise en ligne en un clic)
services:
  - type: web
    name: monopoly-promo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Clé secrète qui chiffre les sauvegardes des parties (créée automatiquement par Render)
      - key: SECRET_SAUVEGARDE
        generateValue: true
